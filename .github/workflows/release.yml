name: PHP SDK Release

on:
  push:
    tags:
      - "php-sdk-v*"
      - "commerce-php-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate composer manifest
        working-directory: sdks/php
        run: composer validate --no-check-all --no-check-publish

      - name: Create dist archive
        working-directory: sdks/php
        run: zip -r commerce-php-sdk.zip src composer.json README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: commerce-php-sdk
          path: sdks/php/commerce-php-sdk.zip
