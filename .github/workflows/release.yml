name: Release

permissions: read-all

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'zebodotdev/inttegro-sdk-php'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      INTTEGRO_OPENAPI_SPEC: openapi/commerce.yml
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zebodotdev/openapi
          ref: 7f9e846dc4202e2abb75733e99c69e4fd5b86fae
          path: openapi
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:2.10.3

      - name: Verify the release tag and runtime version
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="$(php -r 'require "src/Inttegro/Version.php"; echo \Inttegro\Version::VERSION;')"
          test "${GITHUB_REF_NAME}" = "v${runtime_version}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"

      - name: Install and run the release checks
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/phpstan analyse --no-progress
          vendor/bin/phpunit

      - name: Archive the exact tagged source
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          git archive --format=tar --prefix="inttegro-sdk-php-${version}/" "${GITHUB_SHA}" \
            | gzip -n > "artifacts/inttegro-sdk-php-${version}.tar.gz"

      - name: Attest the source archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz

      - name: Record release provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" artifacts/ATTESTATION.sigstore.jsonl
          {
            echo "repository=https://github.com/${GITHUB_REPOSITORY}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW_REF}"
            echo "packagist_source_commit=${GITHUB_SHA}"
          } > artifacts/PROVENANCE.txt
          (
            cd artifacts
            sha256sum ./*.tar.gz ./ATTESTATION.sigstore.jsonl ./PROVENANCE.txt > SHA256SUMS
          )

      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --generate-notes
          --title "Inttegro PHP SDK ${GITHUB_REF_NAME}"
          --verify-tag
